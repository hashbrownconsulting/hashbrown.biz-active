<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-label="Hash Brown modular pattern field: grid of geometric tiles built from arches, quarter circles, domes and dots in black on light gray">
  <defs>
    <g id="TA">
      <path d="M50,50 L0,50 A50,50 0 0 1 50,0 Z"/>
      <path d="M50,50 L100,50 A50,50 0 0 0 50,0 Z"/>
      <path d="M50,50 L0,50 A50,50 0 0 0 50,100 Z"/>
      <path d="M50,50 L100,50 A50,50 0 0 1 50,100 Z"/>
    </g>
    <g id="TB">
      <circle cx="25" cy="25" r="25"/><circle cx="75" cy="25" r="25"/>
      <circle cx="25" cy="75" r="25"/><circle cx="75" cy="75" r="25"/>
    </g>
    <g id="TC">
      <path d="M0,50 A50,50 0 0 1 100,50 Z"/>
      <path d="M0,100 L0,75 A25,25 0 0 1 50,75 L50,100 Z"/>
      <path d="M50,100 L50,75 A25,25 0 0 1 100,75 L100,100 Z"/>
    </g>
    <g id="TD">
      <path d="M0,100 A100,100 0 0 1 100,0 A100,100 0 0 1 0,100 Z"/>
    </g>
    <g id="TE">
      <path d="M0,0 L100,0 L0,100 Z"/>
      <path d="M100,100 L100,50 A50,50 0 0 0 50,100 Z"/>
    </g>
    <g id="TG">
      <path d="M0,0 L100,0 L100,100 L50,100 A50,50 0 0 0 0,50 Z"/>
    </g>
    <g id="TH">
      <path d="M0,50 A50,50 0 0 1 100,50 Z"/>
      <path d="M0,100 A50,50 0 0 1 100,100 Z"/>
    </g>
    <g id="TI">
      <path d="M0,100 L0,50 A50,50 0 0 1 50,0 L50,50 A50,50 0 0 1 0,100 Z"/>
      <circle cx="75" cy="75" r="25"/>
    </g>
  </defs>

  <rect width="600" height="400" fill="#F3F3F3"/>

  <g fill="#111113" stroke="#F3F3F3" stroke-width="1.2">
    <!-- row 1 -->
    <use href="#TA" transform="translate(0,0)"/>
    <use href="#TB" transform="translate(100,0)"/>
    <use href="#TC" transform="translate(200,0)"/>
    <use href="#TD" transform="translate(300,0)"/>
    <use href="#TE" transform="translate(400,0)"/>
    <use href="#TA" transform="translate(500,0)"/>
    <!-- row 2 -->
    <use href="#TG" transform="translate(0,100)"/>
    <use href="#TA" transform="translate(100,100)"/>
    <use href="#TI" transform="translate(200,100) rotate(90 50 50)"/>
    <use href="#TC" transform="translate(300,100) rotate(180 50 50)"/>
    <use href="#TH" transform="translate(400,100)"/>
    <use href="#TD" transform="translate(500,100) rotate(90 50 50)"/>
    <!-- row 3 -->
    <use href="#TD" transform="translate(0,200) rotate(90 50 50)"/>
    <use href="#TE" transform="translate(100,200) rotate(180 50 50)"/>
    <use href="#TA" transform="translate(200,200)"/>
    <use href="#TG" transform="translate(300,200) rotate(90 50 50)"/>
    <use href="#TB" transform="translate(400,200)"/>
    <use href="#TC" transform="translate(500,200)"/>
    <!-- row 4 -->
    <use href="#TC" transform="translate(0,300) rotate(180 50 50)"/>
    <use href="#TI" transform="translate(100,300)"/>
    <use href="#TH" transform="translate(200,300) rotate(90 50 50)"/>
    <use href="#TA" transform="translate(300,300)"/>
    <use href="#TE" transform="translate(400,300) rotate(270 50 50)"/>
    <use href="#TG" transform="translate(500,300) rotate(180 50 50)"/>
  </g>
</svg>
