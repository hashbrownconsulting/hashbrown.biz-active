<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-label="Two panels contrasting outbound approaches: a dense crowded field of geometric shapes representing spam, and a single clean composition with generous white space representing a considered brand message">
  <defs>
    <g id="sA">
      <path d="M35,35 L0,35 A35,35 0 0 1 35,0 Z"/>
      <path d="M35,35 L70,35 A35,35 0 0 0 35,0 Z"/>
      <path d="M35,35 L0,35 A35,35 0 0 0 35,70 Z"/>
      <path d="M35,35 L70,35 A35,35 0 0 1 35,70 Z"/>
    </g>
    <g id="sB">
      <circle cx="17.5" cy="17.5" r="17.5"/><circle cx="52.5" cy="17.5" r="17.5"/>
      <circle cx="17.5" cy="52.5" r="17.5"/><circle cx="52.5" cy="52.5" r="17.5"/>
    </g>
    <g id="sC">
      <path d="M0,35 A35,35 0 0 1 70,35 Z"/>
      <path d="M0,70 L0,52.5 A17.5,17.5 0 0 1 35,52.5 L35,70 Z"/>
      <path d="M35,70 L35,52.5 A17.5,17.5 0 0 1 70,52.5 L70,70 Z"/>
    </g>
    <g id="sD"><path d="M0,70 A70,70 0 0 1 70,0 A70,70 0 0 1 0,70 Z"/></g>
    <g id="sE">
      <path d="M0,0 L70,0 L0,70 Z"/>
      <path d="M70,70 L70,35 A35,35 0 0 0 35,70 Z"/>
    </g>
    <g id="sG"><path d="M0,0 L70,0 L70,70 L35,70 A35,35 0 0 0 0,35 Z"/></g>
  </defs>

  <rect width="900" height="420" fill="#F3F3F3"/>

  <!-- LEFT: noise — packed edge to edge, no breathing room -->
  <g fill="#111113" stroke="#F3F3F3" stroke-width="1">
    <use href="#sA" transform="translate(0,0)"/>   <use href="#sB" transform="translate(70,0)"/>
    <use href="#sC" transform="translate(140,0)"/> <use href="#sD" transform="translate(210,0)"/>
    <use href="#sE" transform="translate(280,0)"/> <use href="#sG" transform="translate(350,0)"/>

    <use href="#sG" transform="translate(0,70) rotate(90 35 35)"/>  <use href="#sA" transform="translate(70,70)"/>
    <use href="#sD" transform="translate(140,70) rotate(90 35 35)"/><use href="#sB" transform="translate(210,70)"/>
    <use href="#sC" transform="translate(280,70) rotate(180 35 35)"/><use href="#sE" transform="translate(350,70) rotate(90 35 35)"/>

    <use href="#sB" transform="translate(0,140)"/>  <use href="#sE" transform="translate(70,140) rotate(180 35 35)"/>
    <use href="#sA" transform="translate(140,140)"/><use href="#sG" transform="translate(210,140) rotate(180 35 35)"/>
    <use href="#sD" transform="translate(280,140)"/><use href="#sC" transform="translate(350,140)"/>

    <use href="#sC" transform="translate(0,210) rotate(180 35 35)"/><use href="#sD" transform="translate(70,210) rotate(90 35 35)"/>
    <use href="#sB" transform="translate(140,210)"/><use href="#sA" transform="translate(210,210)"/>
    <use href="#sG" transform="translate(280,210) rotate(270 35 35)"/><use href="#sE" transform="translate(350,210)"/>

    <use href="#sE" transform="translate(0,280) rotate(270 35 35)"/><use href="#sC" transform="translate(70,280)"/>
    <use href="#sG" transform="translate(140,280)"/><use href="#sD" transform="translate(210,280) rotate(90 35 35)"/>
    <use href="#sA" transform="translate(280,280)"/><use href="#sB" transform="translate(350,280)"/>

    <use href="#sA" transform="translate(0,350)"/>  <use href="#sG" transform="translate(70,350) rotate(90 35 35)"/>
    <use href="#sE" transform="translate(140,350)"/><use href="#sC" transform="translate(210,350) rotate(180 35 35)"/>
    <use href="#sB" transform="translate(280,350)"/><use href="#sD" transform="translate(350,350)"/>
  </g>

  <!-- divider -->
  <line x1="460" y1="40" x2="460" y2="380" stroke="#9696A1" stroke-width="1"/>

  <!-- RIGHT: signal — one considered form, generous space -->
  <g fill="#111113" stroke="#F3F3F3" stroke-width="1.4" transform="translate(605,120)">
    <path d="M90,90 L0,90 A90,90 0 0 1 90,0 Z"/>
    <path d="M90,90 L180,90 A90,90 0 0 0 90,0 Z"/>
    <path d="M90,90 L0,90 A90,90 0 0 0 90,180 Z"/>
    <path d="M90,90 L180,90 A90,90 0 0 1 90,180 Z"/>
  </g>
  <g fill="#111113" transform="translate(650,330)">
    <path d="M0,30 L0,15 A15,15 0 0 1 30,15 L30,30 Z"/>
    <path d="M30,30 L30,15 A15,15 0 0 1 60,15 L60,30 Z"/>
    <path d="M60,30 L60,15 A15,15 0 0 1 90,15 L90,30 Z"/>
  </g>
</svg>
