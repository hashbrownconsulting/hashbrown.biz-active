<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hash Brown · Blog</title>
<meta name="robots" content="noindex">
</head>
<body>
<p>This page has moved. Redirecting to <a href="https://hashbrown.biz/blog/" id="fallbackLink">hashbrown.biz/blog/</a>…</p>
<script>
(function(){
  var slug=new URLSearchParams(location.search).get('slug');
  var dest='https://hashbrown.biz/blog/';
  if(slug&&/^[a-z0-9\-]+$/i.test(slug)){
    dest='https://hashbrown.biz/blog/'+slug+'/';
  }
  document.getElementById('fallbackLink').href=dest;
  location.replace(dest);
})();
</script>
</body>
</html>
